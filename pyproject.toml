[project]
name = "memetic"
version = "0.1.0"
description = "Generator/fixer self-play with memory over a frozen frontier model (no weight training)."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "sentence-transformers>=2.2",   # local code embedder
    "openai>=1.0",                  # OpenAI-compatible gateway client
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
